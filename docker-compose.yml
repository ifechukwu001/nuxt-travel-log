services:
  minio:
    image: quay.io/minio/aistor/minio:latest

    ports:
     - ${MINIO_API_PORT}:9000
     - ${MINIO_CONSOLE_PORT}:9001

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${S3_ENDPOINT}

    volumes:
      - ./docker-data/minio/data:/mnt/data
      - ./docker-data/minio/minio.license:/minio.license:ro

    command: server --console-address ":9001" /mnt/data --license /minio.license
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3